<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股總覽 · 持股 + 籌碼</title>
<style>
  :root{ --bg:#0f1420; --line:#2b3448; --ink:#e8ecf4; --muted:#8b96ad; --accent:#6e8fff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);padding:0 0 40px}
  .navbar{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;
    padding:10px 16px;flex-wrap:wrap}
  .navbar .brand{font-size:14px;font-weight:800;letter-spacing:.02em;margin-right:8px}
  .navbar a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);
    background:#161c2b;border-radius:999px;padding:5px 13px;transition:.15s}
  .navbar a:hover{color:var(--ink);border-color:var(--accent)}
  .navbar .spacer{flex:1}
  .navbar .reload{color:var(--accent);cursor:pointer}
  section{border:0}
  .frame-wrap{position:relative}
  .frame-label{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;
    padding:18px 18px 0;max-width:1040px;margin:0 auto}
  iframe{width:100%;border:0;display:block;background:var(--bg)}
  .divider{height:1px;background:var(--line);max-width:1040px;margin:28px auto 0}
</style>
</head>
<body>
  <div class="navbar">
    <span class="brand">台股總覽</span>
    <a href="#holdings">我的持股</a>
    <a href="#chips">大盤籌碼</a>
    <span class="spacer"></span>
    <a class="reload" id="reloadAll">↻ 重新載入</a>
  </div>

  <section class="frame-wrap" id="holdings">
    <div class="frame-label">Portfolio · 本機私人</div>
    <iframe id="fHold" src="index.html" scrolling="no" title="我的持股"></iframe>
  </section>

  <div class="divider"></div>

  <section class="frame-wrap" id="chips">
    <div class="frame-label">Chips · 大盤籌碼（公開資料）</div>
    <iframe id="fChips" src="chips.html" scrolling="no" title="大盤籌碼"></iframe>
  </section>

<script>
// 自動調整每個 iframe 高度，避免內部再出現捲軸（兩份儀表板堆疊成單一長頁）
function fit(f){
  try{
    const d=f.contentDocument||(f.contentWindow&&f.contentWindow.document);
    if(!d||!d.body) return;
    const h=Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
    if(h>0) f.style.height=(h+20)+'px';
  }catch(e){ /* 同源才讀得到；同一個 Pages 站台為同源，正常運作 */ }
}
function fitAll(){ ['fHold','fChips'].forEach(id=>{const f=document.getElementById(id);if(f)fit(f);}); }

['fHold','fChips'].forEach(id=>{
  const f=document.getElementById(id);
  f.addEventListener('load',()=>{ fit(f); setTimeout(()=>fit(f),600); setTimeout(()=>fit(f),1500); });
});
// 內容（圖表、載入資料）可能延遲改變高度，定期校正
setInterval(fitAll, 2000);
window.addEventListener('resize', fitAll);

// 重新載入：重載兩個 iframe，讓它們重抓最新 CSV
document.getElementById('reloadAll').addEventListener('click',()=>{
  ['fHold','fChips'].forEach(id=>{ const f=document.getElementById(id); f.src=f.src.split('#')[0]; });
});
</script>
</body>
</html>
